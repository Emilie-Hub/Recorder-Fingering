// 拍長量化計算
function quantizeDuration(rawDur) {
  const standards = [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0];
  if (rawDur <= 0) return 0.5;
  if (rawDur >= 4.0) return 4.0;
  let best = standards[0];
  let minDiff = Math.abs(rawDur - standards[0]);
  for (let s of standards) {
    let diff = Math.abs(rawDur - s);
    if (diff < minDiff) {
      minDiff = diff;
      best = s;
    }
  }
  return best;
}

// 純 JS MusicXML 解析器
function parseMusicXMLString(xmlText) {
  const parser = new DOMParser();
  const xmlDoc = parser.parseFromString(xmlText, "text/xml");
  
  let timeSig = "4/4";
  let keySig = "C";
  let notes = [];
  let noteId = 0;
  let divisions = 1;

  const fifthsMap = {
    "-7": "Cb", "-6": "Gb", "-5": "Db", "-4": "Ab", "-3": "Eb", "-2": "Bb", "-1": "F",
    "0": "C", "1": "G", "2": "D", "3": "A", "4": "E", "5": "B", "6": "F#", "7": "C#"
  };

  const part = xmlDoc.querySelector("part");
  if (!part) throw new Error("無效的 MusicXML 檔案");

  const measures = part.querySelectorAll("measure");
  measures.forEach((measureEl, mIdx) => {
    const measureNum = parseInt(measureEl.getAttribute("number")) || (mIdx + 1);
    
    const divEl = measureEl.querySelector("attributes > divisions");
    if (divEl) divisions = parseInt(divEl.textContent) || 1;

    const beatsEl = measureEl.querySelector("attributes > time > beats");
    const beatTypeEl = measureEl.querySelector("attributes > time > beat-type");
    if (beatsEl && beatTypeEl) {
      timeSig = `${beatsEl.textContent.trim()}/${beatTypeEl.textContent.trim()}`;
    }

    const fifthsEl = measureEl.querySelector("attributes > key > fifths");
    if (fifthsEl) {
      keySig = fifthsMap[fifthsEl.textContent.trim()] || "C";
    }

    const noteNodes = measureEl.querySelectorAll("note");
    noteNodes.forEach(nNode => {
      if (nNode.querySelector("chord")) return;

      const isRest = nNode.querySelector("rest") !== null;
      const durEl = nNode.querySelector("duration");
      const durVal = durEl ? parseFloat(durEl.textContent) : divisions;
      const quarterLength = durVal / divisions;
      const qDuration = quantizeDuration(quarterLength);

      if (isRest) {
        notes.push({
          id: noteId++,
          measure: measureNum,
          pitch: "Rest",
          step: "R",
          octave: 0,
          accidental: "",
          duration: qDuration,
          midi_number: 0,
          frequency: 0.0,
          fingering: null,
          is_rest: true
        });
      } else {
        const stepEl = nNode.querySelector("pitch > step");
        const alterEl = nNode.querySelector("pitch > alter");
        const octaveEl = nNode.querySelector("pitch > octave");

        if (!stepEl || !octaveEl) return;

        const step = stepEl.textContent.trim();
        const octave = parseInt(octaveEl.textContent.trim());
        let alter = alterEl ? parseInt(alterEl.textContent.trim()) : 0;

        let acc = "";
        if (alter === 1) acc = "#";
        else if (alter === -1) acc = "b";

        const pitchName = `${step}${acc}${octave}`;
        const fingeringData = RECORDER_DATABASE[pitchName] || null;

        notes.push({
          id: noteId++,
          measure: measureNum,
          pitch: pitchName,
          step: step,
          octave: octave,
          accidental: acc,
          duration: qDuration,
          midi_number: 60,
          frequency: fingeringData ? fingeringData.freq : 440.0,
          fingering: fingeringData ? { baroque: fingeringData.baroque, german: fingeringData.german } : null,
          is_rest: false
        });
      }
    });
  });

  return { notes, timeSignature: timeSig, keySignature: keySig };
}

// Vue 3 應用程式
const { createApp, ref, computed, watch, nextTick, onMounted } = Vue;

createApp({
  setup() {
    const parsedNotes = ref([]);
    const timeSignature = ref("4/4");
    const keySignature = ref("C");
    const fingeringType = ref('baroque');
    const filterMode = ref('all');
    const rangeStart = ref(1);
    const rangeEnd = ref(1);
    let audioCtx = null;

    const notesByMeasure = computed(() => {
      const map = {};
      parsedNotes.value.forEach(n => {
        if (!map[n.measure]) map[n.measure] = [];
        map[n.measure].push(n);
      });
      return map;
    });

    const sortedMeasureNumbers = computed(() => {
      return Object.keys(notesByMeasure.value).map(Number).sort((a, b) => a - b);
    });

    const maxMeasureNumber = computed(() => {
      return sortedMeasureNumbers.value.length > 0 ? Math.max(...sortedMeasureNumbers.value) : 1;
    });

    const filteredMeasureNumbers = computed(() => {
      if (filterMode.value === 'all') return sortedMeasureNumbers.value;
      return sortedMeasureNumbers.value.filter(m => m >= rangeStart.value && m <= rangeEnd.value);
    });

    const playTone = (freq) => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (!freq) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    };

    const handleFileUpload = async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();

      try {
        let result = null;

        if (fileName.endsWith('.mxl')) {
          const zip = await JSZip.loadAsync(file);
          let xmlFile = null;
          const files = Object.keys(zip.files);
          const target = files.find(f => f.endsWith('.xml') && !f.startsWith('META-INF/'));
          if (target) xmlFile = zip.file(target);

          if (!xmlFile) throw new Error("解壓縮未發現 MusicXML 內容");
          const xmlText = await xmlFile.async("text");
          result = parseMusicXMLString(xmlText);

        } else if (fileName.endsWith('.xml') || fileName.endsWith('.musicxml')) {
          const text = await file.text();
          result = parseMusicXMLString(text);

        } else if (fileName.endsWith('.mid') || fileName.endsWith('.midi')) {
          const buffer = await file.arrayBuffer();
          const midi = new Midi(buffer);
          let notes = [];
          let noteId = 0;
          let timeSig = "4/4";

          if (midi.header.timeSignatures.length > 0) {
            const ts = midi.header.timeSignatures[0].timeSignature;
            timeSig = `${ts[0]}/${ts[1]}`;
          }

          const track = midi.tracks.find(t => t.notes.length > 0) || midi.tracks[0];
          if (track) {
            const trackNotes = track.notes.sort((a,b) => a.time - b.time);
            const bpm = midi.header.tempos.length > 0 ? midi.header.tempos[0].bpm : 120;
            const secondsPerBeat = 60 / bpm;
            const beatsPerMeasure = parseInt(timeSig.split('/')[0]) || 4;

            trackNotes.forEach((n) => {
              const beatStart = n.time / secondsPerBeat;
              const quarterLength = n.duration / secondsPerBeat;
              const qDuration = quantizeDuration(quarterLength);
              const measureNum = Math.floor(beatStart / beatsPerMeasure) + 1;
              const pitchName = n.name;

              let step = pitchName[0];
              let octave = parseInt(pitchName.slice(-1));
              let acc = pitchName.includes("#") ? "#" : (pitchName.includes("b") ? "b" : "");
              const fingeringData = RECORDER_DATABASE[pitchName] || null;

              notes.push({
                id: noteId++,
                measure: measureNum,
                pitch: pitchName,
                step: step,
                octave: octave,
                accidental: acc,
                duration: qDuration,
                midi_number: n.midi,
                frequency: fingeringData ? fingeringData.freq : 440.0,
                fingering: fingeringData ? { baroque: fingeringData.baroque, german: fingeringData.german } : null,
                is_rest: false
              });
            });
          }
          result = { notes, timeSignature: timeSig, keySignature: "C" };
        }

        if (result && result.notes.length > 0) {
          parsedNotes.value = result.notes;
          timeSignature.value = result.timeSignature;
          keySignature.value = result.keySignature;
          rangeStart.value = 1;
          rangeEnd.value = maxMeasureNumber.value;

          nextTick(() => {
            renderVexFlowMultiStave();
            renderAllFingerings();
          });
        }
      } catch (err) {
        alert("樂譜讀取失敗，請確認檔案格式是否正確。");
        console.error(err);
      }
    };

    const getVexDuration = (dur, isRest) => {
        let base = 'q';
        let dotted = false;
        
        if (dur >= 3.5) base = 'w';
        else if (dur >= 2.5) { base = 'h'; dotted = true; }
        else if (dur >= 1.75) base = 'h';
        else if (dur >= 1.25) { base = 'q'; dotted = true; }
        else if (dur >= 0.85) base = 'q';
        else if (dur >= 0.65) { base = '8'; dotted = true; }
        else if (dur >= 0.35) base = '8';
        else if (dur >= 0.18) base = '16';
        else base = '32';
        
        let res = base + (isRest ? 'r' : '');
        return { res, dotted };
    };

    const renderVexFlowMultiStave = () => {
      const container = document.getElementById("vexflowContainer");
      if (!container) return;
      container.innerHTML = "";

      const VF = Vex.Flow;
      const measureNums = sortedMeasureNumbers.value;
      
      let totalWidth = 30;
      const staveWidths = {};
      
      measureNums.forEach((mNum, idx) => {
        const count = notesByMeasure.value[mNum].length;
        const width = Math.max(220, count * 65 + (idx === 0 ? 120 : 40));
        staveWidths[mNum] = width;
        totalWidth += width;
      });

      const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
      renderer.resize(totalWidth + 50, 190);
      const context = renderer.getContext();

      let currentX = 10;
      const tsParts = timeSignature.value.split('/');
      const numBeats = parseInt(tsParts[0]) || 4;
      const beatValue = parseInt(tsParts[1]) || 4;

      measureNums.forEach((mNum, idx) => {
        const mNotes = notesByMeasure.value[mNum];
        const width = staveWidths[mNum];
        const stave = new VF.Stave(currentX, 15, width);

        if (idx === 0) {
          stave.addClef("treble").addTimeSignature(timeSignature.value).addKeySignature(keySignature.value);
        }

        stave.setEndBarType(idx === measureNums.length - 1 ? VF.Barline.type.END : VF.Barline.type.SINGLE);
        stave.setContext(context).draw();

        const vexNotes = mNotes.map(n => {
          const durInfo = getVexDuration(n.duration, n.is_rest);
          const keys = n.is_rest ? ["b/4"] : [`${n.step.toLowerCase()}/${n.octave}`];
          
          const staveNote = new VF.StaveNote({ 
            clef: "treble", 
            keys: keys, 
            duration: durInfo.res,
            auto_stem: true 
          });
          
          if (!n.is_rest && n.accidental) {
            staveNote.addModifier(new VF.Accidental(n.accidental));
          }
          if (durInfo.dotted) {
            staveNote.addModifier(new VF.Dot());
          }
          return staveNote;
        });

        if (vexNotes.length > 0) {
          const voice = new VF.Voice({ num_beats: numBeats, beat_value: beatValue });
          voice.setMode(VF.Voice.Mode.SOFT);
          voice.addTickables(vexNotes);

          let beams = [];
          try {
            beams = VF.Beam.generateBeams(vexNotes, {
              groups: [new VF.Fraction(1, beatValue)]
            });
          } catch (e) {
            console.warn("連音線生成提示:", e);
          }

          new VF.Formatter().joinVoices([voice]).format([voice], width - (idx === 0 ? 120 : 40));
          voice.draw(context, stave);
          beams.forEach(beam => beam.setContext(context).draw());
        }

        currentX += width;
      });
    };

    const renderAllFingerings = () => {
      parsedNotes.value.forEach((note) => {
        if (!note.is_rest && note.fingering) {
          drawPencilRecorderSVG(`note-svg-${note.id}`, note.fingering[fingeringType.value]);
        }
      });
    };

    // 繪製直笛與按孔 SVG (含左右手顏色區分)
    const drawPencilRecorderSVG = (svgId, holes) => {
      const svg = document.getElementById(svgId);
      if (!svg) return;
      svg.innerHTML = '';

      const strokeColor = "#5c4838";
      
      const topCap = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      topCap.setAttribute("x", "25"); topCap.setAttribute("y", "4");
      topCap.setAttribute("width", "20"); topCap.setAttribute("height", "10");
      topCap.setAttribute("rx", "3");
      topCap.setAttribute("fill", "#e2c5a0");
      topCap.setAttribute("stroke", strokeColor);
      topCap.setAttribute("stroke-width", "2");
      svg.appendChild(topCap);

      const body = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      body.setAttribute("x", "22"); body.setAttribute("y", "12");
      body.setAttribute("width", "26"); body.setAttribute("height", "172");
      body.setAttribute("rx", "10");
      body.setAttribute("fill", "#f3e5ce");
      body.setAttribute("stroke", strokeColor);
      body.setAttribute("stroke-width", "2.5");
      svg.appendChild(body);

      const yPositions = [28, 48, 68, 88, 110, 130, 150, 168];

      holes.forEach((state, idx) => {
        const cx = idx === 0 ? 10 : 35;
        const cy = yPositions[idx];
        const r = (idx === 6 || idx === 7) ? 4.5 : 6;
        
        // 顏色區分：上四孔(idx 0~3)使用藍色，下四孔(idx 4~7)使用黑色
        const holeColor = idx < 4 ? "#2563eb" : "#3d3228";

        if (state === 0.5) {
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          
          const baseCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          baseCircle.setAttribute("cx", cx); baseCircle.setAttribute("cy", cy); baseCircle.setAttribute("r", r);
          baseCircle.setAttribute("fill", "#fffdf8");
          baseCircle.setAttribute("stroke", strokeColor);
          baseCircle.setAttribute("stroke-width", "2");
          g.appendChild(baseCircle);

          const halfPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
          halfPath.setAttribute("d", `M ${cx} ${cy - r} A ${r} ${r} 0 0 0 ${cx} ${cy + r} Z`);
          halfPath.setAttribute("fill", holeColor);
          g.appendChild(halfPath);

          svg.appendChild(g);
        } else {
          const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          circle.setAttribute("cx", cx); circle.setAttribute("cy", cy); circle.setAttribute("r", r);
          circle.setAttribute("stroke", strokeColor);
          circle.setAttribute("stroke-width", "2");

          if (state === 1) circle.setAttribute("fill", holeColor);
          else circle.setAttribute("fill", "#fffdf8");

          svg.appendChild(circle);
        }
      });
    };

    watch([fingeringType, filteredMeasureNumbers], () => {
      nextTick(() => renderAllFingerings());
    });

    onMounted(() => {
      parsedNotes.value = DEMO_NOTES;
      rangeStart.value = 1;
      rangeEnd.value = maxMeasureNumber.value;

      nextTick(() => {
        renderVexFlowMultiStave();
        renderAllFingerings();
      });
    });

    return { 
      parsedNotes, timeSignature, keySignature, fingeringType, 
      sortedMeasureNumbers, maxMeasureNumber, filteredMeasureNumbers, 
      notesByMeasure, filterMode, rangeStart, rangeEnd,
      handleFileUpload, playTone 
    };
  }
}).mount('#app');
</script>
</body>
</html>
